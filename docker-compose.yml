

services:
  postgres:
    image: postgres:15-alpine
    container_name: intent_postgres
    restart: always
    environment:
      POSTGRES_USER: crypto_admin
      POSTGRES_PASSWORD: crypto_secret_2026
      POSTGRES_DB: intent_engine
    ports:
      - "5439:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    command: ["postgres", "-c", "password_encryption=md5"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crypto_admin -d intent_engine"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - crypto-network

  redis:
    image: redis/redis-stack-server:7.2.0-v9
    container_name: intent_redis
    restart: always
    ports:
      - "6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - crypto-network

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: intent_rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "5672:5672"   # AMQP protocol
      - "15672:15672" # Management Web UI
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - crypto-network

  qdrant:
    image: qdrant/qdrant:latest
    container_name: intent_qdrant
    restart: always
    ports:
      - "6333:6333" # REST API
      - "6334:6334" # gRPC
    volumes:
      - qdrantdata:/qdrant/storage
    networks:
      - crypto-network

  prometheus:
    image: prom/prometheus:latest
    container_name: intent_engine_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - crypto-network

  grafana:
    image: grafana/grafana:latest
    container_name: intent_engine_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./deploy/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./deploy/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - crypto-network

networks:
  crypto-network:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  rabbitmqdata:
  qdrantdata:
  prometheus_data:
  grafana_data: